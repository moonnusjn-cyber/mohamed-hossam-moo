<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Hossam Social Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { color: #00a884; font-size: 22px; margin-bottom: 4px; }
        .header p { color: #8696a0; font-size: 13px; }
        
        .chat-container { width: 100%; max-width: 480px; background: #111b21; border-radius: 10px; display: flex; flex-direction: column; height: 85vh; border: 1px solid #222d34; }
        
        .messages-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 10px 10px; }
        
        .msg-card { background: #202c33; padding: 10px 14px; border-radius: 8px; border-right: 4px solid #00a884; max-width: 85%; align-self: flex-start; word-break: break-word; }
        .msg-card.me { align-self: flex-end; background: #005c4b; border-right: none; border-left: 4px solid #00a884; }
        .sender-name { font-size: 12px; color: #53bdeb; font-weight: bold; margin-bottom: 4px; }
        .msg-text { font-size: 14px; color: #e9edef; margin-bottom: 6px; }
        .msg-link { display: inline-block; padding: 6px 12px; background: #00a884; color: #111b21; text-decoration: none; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .msg-time { font-size: 10px; color: #8696a0; text-align: left; margin-top: 4px; }
        
        .input-area { padding: 12px; background: #202c33; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
        .input-area input { padding: 10px; border-radius: 6px; border: 1px solid #2a3942; background: #111b21; color: #e9edef; font-size: 13px; outline: none; }
        .input-area button { padding: 10px; background: #00a884; color: #111b21; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .input-area button:hover { background: #029071; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mohamed Hossam Social Platform</h1>
        <p>تطبيق التواصل والبث الفوري للجميع</p>
    </div>

    <div class="chat-container">
        <div class="messages-area" id="messagesArea">
            <!-- الرسائل والروابط تظهر هنا فوراً -->
        </div>

        <div class="input-area">
            <input type="text" id="username" placeholder="اسمك">
            <input type="text" id="msgText" placeholder="اكتب الرسالة...">
            <input type="url" id="linkUrl" placeholder="رابط (اختياري) https://...">
            <button onclick="sendMessage()">إرسال 🚀</button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "mohamed-hossam-23d46.firebaseapp.com",
            databaseURL: "https://mohamed-hossam-23d46-default-rtdb.firebaseio.com",
            projectId: "mohamed-hossam-23d46",
            storageBucket: "mohamed-hossam-23d46.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function sendMessage() {
            const name = document.getElementById('username').value.trim() || 'مستخدم';
            const text = document.getElementById('msgText').value.trim();
            const link = document.getElementById('linkUrl').value.trim();

            if (!text && !link) {
                alert("اكتب رسالة أو أدخل رابطاً على الأقل!");
                return;
            }

            database.ref('chat_messages').push({
                sender: name,
                message: text,
                link: link,
                timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            });

            document.getElementById('msgText').value = '';
            document.getElementById('linkUrl').value = '';
        }

        database.ref('chat_messages').on('child_added', (snapshot) => {
            const data = snapshot.val();
            const area = document.getElementById('messagesArea');

            const card = document.createElement('div');
            card.className = 'msg-card';
            
            card.innerHTML = `
                <div class="sender-name">${data.sender}</div>
                ${data.message ? `<div class="msg-text">${data.message}</div>` : ''}
                ${data.link ? `<a href="${data.link}" target="_blank" class="msg-link">🔗 فتح الرابط</a>` : ''}
                <div class="msg-time">${data.timestamp}</div>
            `;

            area.appendChild(card);
            area.scrollTop = area.scrollHeight;
        });
    </script>
</body>
</html>
