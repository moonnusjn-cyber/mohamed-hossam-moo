<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Hossam Social Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
        
        .chat-app { width: 100%; max-width: 500px; height: 90vh; background: #111b21; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #222d34; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        
        /* شريط العنوان العلوي */
        .chat-header { background: #202c33; padding: 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222d34; }
        .chat-header .avatar { width: 40px; height: 40px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #111b21; font-size: 18px; }
        .chat-header .info h2 { font-size: 16px; color: #e9edef; }
        .chat-header .info p { font-size: 12px; color: #8696a0; }
        
        /* منطقة الرسائل المحادثة الجماعية */
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 12px 12px; }
        
        /* كروت الرسائل */
        .message-bubble { background: #202c33; padding: 8px 12px; border-radius: 8px; max-width: 80%; width: fit-content; word-break: break-word; position: relative; }
        .message-bubble.sender-me { align-self: flex-end; background: #005c4b; }
        .message-bubble .user-name { font-size: 12px; color: #53bdeb; font-weight: bold; margin-bottom: 3px; }
        .message-bubble .text { font-size: 14px; color: #e9edef; line-height: 1.4; }
        .message-bubble .link-btn { display: inline-block; margin-top: 6px; padding: 6px 10px; background: #00a884; color: #111b21; text-decoration: none; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .message-bubble .time-stamp { font-size: 10px; color: #8696a0; text-align: left; margin-top: 4px; display: block; }
        
        /* منطقة إدخال البيانات والرسائل */
        .chat-inputs { background: #202c33; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #222d34; }
        .chat-inputs .row { display: flex; gap: 8px; }
        .chat-inputs input { padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3942; background: #111b21; color: #e9edef; font-size: 14px; outline: none; flex: 1; }
        .chat-inputs input:focus { border-color: #00a884; }
        .chat-inputs button { padding: 10px 18px; background: #00a884; color: #111b21; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .chat-inputs button:hover { background: #029071; }
    </style>
</head>
<body>

    <div class="chat-app">
        <!-- هيدر الشات -->
        <div class="chat-header">
            <div class="avatar">MH</div>
            <div class="info">
                <h2>Mohamed Hossam Social Platform</h2>
                <p>الشات الجماعي المباشر (الرسائل تصل للجميع)</p>
            </div>
        </div>

        <!-- ساحة الشات المباشرة -->
        <div class="chat-box" id="chatBox">
            <!-- الرسائل بتظهر هنا فوراً -->
        </div>

        <!-- مدخلات كتابة الرسالة والإرسال -->
        <div class="chat-inputs">
            <input type="text" id="usernameInput" placeholder="اسمك في الشات (مثال: Mohamed Hossam)">
            <div class="row">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك للجميع هنا...">
                <button onclick="sendChatMessage()">إرسال 🚀</button>
            </div>
            <input type="url" id="linkInput" placeholder="رابط إضافي إن وجد (https://...)">
        </div>
    </div>

    <!-- مكتبات Firebase التشغيلية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. بيانات الربط بقاعدة بيانات الفايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "ضع_هنا_API_KEY",
            authDomain: "mohamed-hossam-23d46.firebaseapp.com",
            databaseURL: "https://mohamed-hossam-23d46-default-rtdb.firebaseio.com",
            projectId: "mohamed-hossam-23d46",
            storageBucket: "mohamed-hossam-23d46.appspot.com",
            messagingSenderId: "ضع_هنا_SENDER_ID",
            appId: "ضع_هنا_APP_ID"
        };

        // 2. تهيئة القاعدة
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 3. دالة إرسال الرسالة إلى الشات الجماعي
        function sendChatMessage() {
            const name = document.getElementById('usernameInput').value.trim() || 'مستخدم مجهول';
            const message = document.getElementById('messageInput').value.trim();
            const link = document.getElementById('linkInput').value.trim();

            if (!message && !link) {
                alert("يرجى كتابة رسالة أو إدخال رابط أولاً!");
                return;
            }

            // إرسال البيانات فوراً بقسم group_chat في قاعدة البيانات
            database.ref('group_chat').push({
                sender: name,
                text: message,
                link: link,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            });

            // تفريغ خانات الرسائل
            document.getElementById('messageInput').value = '';
            document.getElementById('linkInput').value = '';
        }

        // 4. الاستماع الفوري لرسائل جميع الأفراد وبثها للكل بدون Refresh
        database.ref('group_chat').on('child_added', (snapshot) => {
            const data = snapshot.val();
            const chatBox = document.getElementById('chatBox');
            const myName = document.getElementById('usernameInput').value.trim();

            const bubble = document.createElement('div');
            // تمييز رسائل الشخص نفسه باللون الأخضر
            const isMe = myName !== "" && data.sender === myName;
            bubble.className = `message-bubble ${isMe ? 'sender-me' : ''}`;

            bubble.innerHTML = `
                <div class="user-name">${data.sender}</div>
                ${data.text ? `<div class="text">${data.text}</div>` : ''}
                ${data.link ? `<a href="${data.link}" target="_blank" class="link-btn">🔗 فتح الرابط المرفق</a>` : ''}
                <span class="time-stamp">${data.time}</span>
            `;

            chatBox.appendChild(bubble);
            // التمرير التلقائي لآخر رسالة
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
